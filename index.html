<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Regangan PJ">
<meta name="theme-color" content="#070d24">
<title>Regangan Dinamik PJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070d24; --kad:#121b3d; --kad2:#1a2550; --garis:rgba(255,255,255,.09);
    --teks:#f5f7ff; --redup:#a3b1d6;
    --hijau:#22c55e; --merah:#f43f5e; --kuning:#fde047; --biru:#38bdf8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--teks);
       background:radial-gradient(800px 500px at 100% -5%, rgba(139,92,246,.28), transparent 60%),
                  radial-gradient(700px 500px at -15% 25%, rgba(6,182,212,.22), transparent 60%),
                  radial-gradient(600px 400px at 50% 110%, rgba(236,72,153,.18), transparent 60%), var(--bg);
       min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  main{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 32px}

  /* ---------- Hero ---------- */
  .hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 20px;min-height:150px;
        background:linear-gradient(120deg,#7c3aed 0%,#2563eb 45%,#06b6d4 75%,#22c55e 100%);
        box-shadow:0 14px 34px rgba(37,99,235,.35)}
  .hero::before{content:"";position:absolute;width:220px;height:220px;right:-60px;top:-70px;border-radius:50%;background:rgba(255,255,255,.12)}
  .hero::after{content:"";position:absolute;width:140px;height:140px;right:70px;bottom:-80px;border-radius:50%;background:rgba(255,255,255,.08)}
  .lencana{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);
        padding:4px 10px;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.6px}
  .hero h1{position:relative;z-index:1;margin:10px 0 0;font-size:1.7rem;font-weight:800;line-height:1.08;letter-spacing:-.4px}
  .hero p{position:relative;z-index:1;margin:8px 0 0;font-weight:600;font-size:.85rem;opacity:.92;max-width:58%}
  .hero p b{background:#22c55e;padding:1px 7px;border-radius:6px} .hero p b+b{background:#f43f5e}
  .hero .figura{position:absolute;right:6px;bottom:4px;width:128px;height:128px;z-index:1;
        stroke:#fff;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;
        filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:lompat 2.2s ease-in-out infinite}
  .hero .figura .k{fill:#fff;stroke:none}
  .hero .figura .bintang{fill:#fde047;stroke:none}
  @keyframes lompat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  .tajuk-seksyen{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
  .tajuk-seksyen h2{font-size:1rem;font-weight:800;margin:0}
  .tajuk-seksyen span{font-size:.72rem;color:var(--redup)}

  /* ---------- Karusel kad regangan ---------- */
  #senaraiEx{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 12px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
  #senaraiEx::-webkit-scrollbar{display:none}
  .kad-ex{flex:0 0 104px;scroll-snap-align:center;border:2px solid var(--garis);background:var(--kad);color:var(--teks);border-radius:20px;
        padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:inherit;cursor:pointer;
        transition:transform .18s, border-color .18s, box-shadow .18s}
  .kad-ex:active{transform:scale(.95)}
  .jubin{position:relative;width:84px;height:84px;border-radius:16px;display:flex;align-items:center;justify-content:center;
        background:linear-gradient(135deg,var(--w1),var(--w2));box-shadow:inset 0 -6px 14px rgba(0,0,0,.15)}
  .jubin .no{position:absolute;top:5px;left:6px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.28);
        font-size:.66rem;font-weight:800;display:flex;align-items:center;justify-content:center}
  .kad-ex .nm{font-size:.74rem;font-weight:700;text-align:center;line-height:1.15;min-height:2.3em;display:flex;align-items:center}
  .kad-ex.dipilih{border-color:var(--w1);transform:translateY(-3px);box-shadow:0 10px 24px -6px var(--w1)}
  .kad-ex.dipilih::after{content:"";width:22px;height:4px;border-radius:4px;background:var(--w1);margin-top:-4px}

  /* ikon figura */
  .ik{width:62px;height:62px;stroke:#fff;fill:none;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
  .ik .k{fill:#fff;stroke:none}
  .ik .a{stroke:var(--kuning);stroke-width:2.6;marker-end:url(#mk)}
  .ik .bel{opacity:.5}
  .ik .dinding{stroke:rgba(255,255,255,.55);stroke-width:3;stroke-dasharray:4 4}

  /* ---------- Pentas kamera ---------- */
  .pentas{position:relative;margin-top:6px;border-radius:26px;overflow:hidden;background:#040817;aspect-ratio:3/4;
          border:1px solid var(--garis);box-shadow:0 20px 44px rgba(0,0,0,.45)}
  @media (min-width:600px){ .pentas{aspect-ratio:4/3} }
  .pentas video,.pentas canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cermin{transform:scaleX(-1)}
  .atas{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;z-index:2}
  .label-ex{display:flex;gap:10px;align-items:center;background:rgba(4,8,23,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
        border:1px solid var(--garis);border-radius:16px;padding:6px 12px 6px 6px;max-width:78%}
  #ikonEx{flex:0 0 46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  #ikonEx .ik{width:38px;height:38px}
  #tajukEx{font-weight:700;font-size:.85rem;line-height:1.2}
  #fokus{font-size:.68rem;color:var(--redup);margin-top:2px;line-height:1.25}
  .pil{display:flex;align-items:center;gap:6px;background:rgba(4,8,23,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
       border:1px solid var(--garis);border-radius:999px;padding:7px 11px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .pil i{width:8px;height:8px;border-radius:50%;background:var(--redup)}
  .pil.sedia i{background:var(--biru)}
  .pil.langsung i{background:var(--merah);box-shadow:0 0 0 0 rgba(244,63,94,.7);animation:nadi 1.2s infinite}
  @keyframes nadi{70%{box-shadow:0 0 0 8px rgba(244,63,94,0)}100%{box-shadow:0 0 0 0 rgba(244,63,94,0)}}

  #mesej{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px;color:var(--redup)}
  #mesej .bulat{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;
         background:linear-gradient(135deg,#7c3aed,#06b6d4);box-shadow:0 0 0 10px rgba(124,58,237,.15),0 0 0 22px rgba(6,182,212,.08)}
  #mesej .bulat svg{width:48px;height:48px}
  #mesejTeks{font-size:.9rem;max-width:290px;line-height:1.5}
  #mesejTeks b{color:#fff}

  .kad-hasil{position:absolute;left:12px;right:12px;bottom:12px;border-radius:22px;padding:14px 16px;text-align:center;z-index:2;
         background:rgba(4,8,23,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.2)}
  .kad-hasil.hijau{background:linear-gradient(135deg,rgba(22,163,74,.94),rgba(16,185,129,.94));border-color:#86efac;
         box-shadow:0 0 0 6px rgba(34,197,94,.25),0 12px 32px rgba(34,197,94,.45)}
  .kad-hasil.merah{background:linear-gradient(135deg,rgba(225,29,72,.94),rgba(244,63,94,.94));border-color:#fda4af;
         box-shadow:0 0 0 6px rgba(244,63,94,.22),0 12px 32px rgba(244,63,94,.4)}
  .kad-hasil.kuning{border-color:#fbbf24} .kad-hasil.biru{border-color:var(--biru)}
  .kad-hasil.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.85);opacity:.4}100%{transform:scale(1);opacity:1}}
  #kTajuk{display:flex;align-items:center;justify-content:center;gap:10px;font-size:2.2rem;font-weight:800;line-height:1.05;letter-spacing:1px}
  #kTajuk svg{width:42px;height:42px;flex:0 0 42px}
  #kSebab{font-size:.92rem;font-weight:600;margin-top:6px;opacity:.96}

  /* ---------- Butang ---------- */
  .kawalan{display:flex;gap:10px;margin-top:14px}
  button.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:18px;padding:16px 14px;
         font-family:inherit;font-size:1.02rem;font-weight:700;cursor:pointer;color:var(--teks);background:var(--kad2);transition:transform .12s}
  button.btn svg{width:22px;height:22px;flex:0 0 22px}
  button.btn:active{transform:scale(.97)}
  button.btn:disabled{opacity:.45}
  button.btn.utama{background:linear-gradient(135deg,#7c3aed,#2563eb 55%,#06b6d4);color:#fff;box-shadow:0 10px 24px rgba(37,99,235,.4)}
  button.btn.bahaya{background:linear-gradient(135deg,#e11d48,#f43f5e);color:#fff;box-shadow:0 10px 24px rgba(244,63,94,.35)}
  button.btn.kecil{flex:0 0 58px;padding:16px 0}
  .togol{display:flex;gap:10px;margin-top:10px}
  .togol label{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--kad);border:1px solid var(--garis);
         border-radius:16px;padding:10px 14px;font-size:.85rem;font-weight:600;cursor:pointer}
  .togol label span{display:flex;align-items:center;gap:8px}
  .togol label svg{width:20px;height:20px;stroke:var(--redup);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .togol input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:#334155;position:relative;cursor:pointer;transition:background .2s;margin:0}
  .togol input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
  .togol input:checked{background:#22c55e}
  .togol input:checked::after{left:21px}
  .nota{margin-top:16px;font-size:.74rem;color:var(--redup);text-align:center;line-height:1.5}
  .tersembunyi{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <marker id="mk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#fde047"/></marker></defs></svg>
<main>
  <section class="hero">
    <span class="lencana">⚡ PENDIDIKAN JASMANI</span>
    <h1>Regangan<br>Dinamik</h1>
    <p>Kesan pergerakan <b>BETUL</b> <b>SALAH</b> secara langsung</p>
    <svg class="figura" viewBox="0 0 64 64">
      <path d="M32 24 V42 M32 42 L22 58 M32 42 L44 54 L50 58"/>
      <path d="M32 27 L18 12 M32 27 L46 12"/>
      <circle class="k" cx="32" cy="16" r="6.5"/>
      <path class="bintang" d="M10 6 l1.6 3.4 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z"/>
      <path class="bintang" d="M54 30 l1.2 2.5 2.7.4-2 1.9.5 2.7-2.4-1.3-2.4 1.3.5-2.7-2-1.9 2.7-.4z"/>
    </svg>
  </section>

  <div class="tajuk-seksyen"><h2>Pilih Regangan</h2><span>leret → untuk lagi</span></div>
  <div id="senaraiEx"></div>

  <div class="pentas">
    <video id="video" playsinline muted autoplay class="cermin"></video>
    <canvas id="kanvas" class="cermin"></canvas>
    <div class="atas">
      <div class="label-ex"><div id="ikonEx"></div><div><div id="tajukEx"></div><div id="fokus"></div></div></div>
      <div id="pil" class="pil tersembunyi"><i></i><span id="pilTeks"></span></div>
    </div>
    <div id="mesej">
      <div class="bulat"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
      <div id="mesejTeks">Letak telefon <b>2–3 meter</b> di hadapan murid supaya seluruh badan kelihatan, kemudian tekan <b>Buka Kamera</b>.</div>
    </div>
    <div id="keputusan" class="kad-hasil tersembunyi"><div id="kTajuk"></div><div id="kSebab"></div></div>
  </div>

  <div class="kawalan">
    <button id="btnKamera" class="btn utama"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Buka Kamera</button>
    <button id="btnMula" class="btn utama tersembunyi" disabled><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>Mula Kesan</button>
    <button id="btnTukar" class="btn kecil" disabled title="Tukar kamera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-6M20 7l-3-3M20 7l-3 3"/><path d="M4 17h6M4 17l3-3M4 17l3 3"/><path d="M17 12a5 5 0 0 0-5-5M7 12a5 5 0 0 0 5 5"/></svg></button>
  </div>
  <div class="togol">
    <label><span><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Bunyi</span><input id="bunyi" type="checkbox" checked></label>
    <label><span><svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 7L3 12l5 5M16 7l5 5-5 5"/></svg>Cermin</span><input id="cermin" type="checkbox" checked></label>
  </div>
  <p class="nota">Selepas tekan <b>Mula Kesan</b>, murid berdiri tegak 2 saat untuk kalibrasi.</p>
</main>
<script type="module">


import { PoseLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const WASM  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

/* =========================================================
   TETAPAN UTAMA (boleh ubah)
   ========================================================= */
const TAHAN_MS   = 300;   // pose mesti stabil (ms) sebelum keputusan BETUL/SALAH bertukar
const KALIB_MS   = 2000;  // masa kalibrasi (berdiri tegak)
const NAMPAK_MIN = 0.4;   // had "visibility" titik badan

/* =========================================================
   TITIK BADAN MEDIAPIPE (33 titik)
   0 hidung | 7 telinga kiri | 8 telinga kanan
   11 bahu kiri | 12 bahu kanan | 13 siku kiri | 14 siku kanan
   15 pergelangan kiri | 16 pergelangan kanan
   23 pinggul kiri | 24 pinggul kanan | 25 lutut kiri | 26 lutut kanan
   27 buku lali kiri | 28 buku lali kanan | 31/32 hujung kaki
   ("kiri/kanan" = kiri/kanan MURID itu sendiri)
   ========================================================= */

const jarak = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const tengah = (a,b) => ({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
const S = (s,t) => ({s,t});   // s = kod keadaan, t = teks untuk dipaparkan

// "Kerangka badan": ukur semua jarak dalam unit LEBAR BAHU
// supaya murid jauh/dekat dengan kamera tetap sama.
function kerangka(lm){
  const ls=lm[11], rs=lm[12];
  const ms=tengah(ls,rs), mh=tengah(lm[23],lm[24]);
  const sw=Math.max(jarak(ls,rs), 1e-3);
  const arah=(ls.x-rs.x)>=0 ? 1 : -1;     // supaya "kiri murid" = positif
  return {
    lm, ms, mh, sw,
    X:(p,o=ms)=>(p.x-o.x)/sw*arah,         // + = ke kiri murid, - = ke kanan murid
    Y:(p,o=ms)=>(p.y-o.y)/sw,              // + = ke bawah
    D:(a,b)=>jarak(a,b)/sw
  };
}

// Kalibrasi: ukuran badan semasa berdiri tegak
function ukurAsas(F){
  const lm=F.lm, telingaY=(lm[7].y+lm[8].y)/2;
  return { sw:F.sw, hidungTelinga:(lm[0].y-telingaY)/F.sw,
           torso:(F.mh.y-F.ms.y)/F.sw, pinggulY:F.mh.y, bahuY:F.ms.y };
}
function puratakan(senarai){
  const o={}; for(const k of Object.keys(senarai[0])) o[k]=senarai.reduce((s,a)=>s+a[k],0)/senarai.length; return o;
}

// Jumlah pergerakan titik tertentu dalam tempoh tertentu (untuk putaran)
function pergerakan(H, idx, ms=700){
  const kini=H.length?H[H.length-1].t:0; let jum=0;
  for(let i=1;i<H.length;i++){
    if(kini-H[i].t>ms) continue;
    for(const j of idx) jum+=jarak(H[i].lm[j],H[i-1].lm[j]);
  }
  return jum/idx.length;
}

/* =========================================================
   10 LATIHAN – setiap satu ada:
   betul[]   : keadaan yang dikira BETUL (selain itu = SALAH)
   kesan()   : membaca titik badan -> keadaan semasa
   ========================================================= */

const EX = [
/* 1 ------------------------------------------------------ */
{
  nama:"1. Regangan Leher Dinamik (Sisi & Atas-Bawah)",
  fokus:"Otot leher dan atas bahu (trapezius)",
  sedia:"Berdiri tegak menghadap kamera.",
  perlu:[0,7,8,11,12],
  betul:["kanan","kiri","tunduk","dongak"],
  kesan(F,B){
    const lm=F.lm, le=lm[7], re=lm[8];
    const senget=Math.atan2(re.y-le.y, Math.abs(le.x-re.x))*180/Math.PI; // + = senget ke kanan murid
    const v=(lm[0].y-(le.y+re.y)/2)/F.sw - B.hidungTelinga;             // + = tunduk
    if(senget> 12) return S("kanan","Kepala senget ke kanan");
    if(senget<-12) return S("kiri","Kepala senget ke kiri");
    if(v> 0.15) return S("tunduk","Kepala tunduk ke bawah");
    if(v<-0.12) return S("dongak","Kepala dongak ke atas");
    return S("lurus","Kepala lurus – gerakan tidak cukup");
  }
},
/* 2 ------------------------------------------------------ */
{
  nama:"2. Regangan Bahu Dinamik Melintasi Dada",
  fokus:"Otot bahu (deltoid) dan dada atas",
  sedia:"Berdiri tegak, tangan di sisi.",
  perlu:[11,12,13,14,15,16],
  betul:["buka","peluk_kanan","peluk_kiri"],
  kesan(F){
    const lw=F.lm[15], rw=F.lm[16];
    const xl=F.X(lw), xr=F.X(rw), yl=F.Y(lw), yr=F.Y(rw);
    if(xl>1.3 && xr<-1.3 && yl>-0.9 && yl<1.0 && yr>-0.9 && yr<1.0) return S("buka","Tangan terbuka luas");
    const kananSilang = xr>0.2 && yr<1.3, kiriSilang = xl<-0.2 && yl<1.3;
    if(kananSilang && (!kiriSilang || xr>=-xl)) return S("peluk_kanan","Tangan kanan melintasi dada");
    if(kiriSilang) return S("peluk_kiri","Tangan kiri melintasi dada");
    if(yl>1.2 && yr>1.2) return S("bawah","Tangan masih di bawah");
    return S("separa","Tangan belum cukup terbuka / belum melintasi dada");
  }
},
/* 3 ------------------------------------------------------ */
{
  nama:"3. Regangan Trisep Dinamik",
  fokus:"Otot belakang lengan (triceps) dan bawah ketiak",
  sedia:"Berdiri tegak menghadap kamera.",
  perlu:[0,11,12,13,14],
  betul:["kanan","kiri"],
  kesan(F){
    const lm=F.lm, lel=lm[13], rel=lm[14], lw=lm[15], rw=lm[16];
    const yR=F.Y(rel), yL=F.Y(lel);
    if(Math.min(yR,yL)>-0.5) return S("rendah","Siku belum diangkat ke belakang kepala");
    if(yR<yL) return F.D(lw,rel)<0.8 ? S("kanan","Siku kanan di belakang kepala & dipegang")
                                      : S("kanan_x","Siku kanan naik, tapi tangan kiri tidak pegang siku");
    return F.D(rw,lel)<0.8 ? S("kiri","Siku kiri di belakang kepala & dipegang")
                           : S("kiri_x","Siku kiri naik, tapi tangan kanan tidak pegang siku");
  }
},
/* 4 ------------------------------------------------------ */
{
  nama:"4. Regangan Dada & Belakang Badan Dinamik",
  fokus:"Otot dada (pectoralis) dan belakang atas (rhomboids)",
  sedia:"Berdiri tegak, angkat tangan ke paras dada.",
  perlu:[11,12,13,14,15,16],
  betul:["buka","peluk"],
  kesan(F){
    const lm=F.lm, lw=lm[15], rw=lm[16];
    const jarakTangan=F.X(lw)-F.X(rw), jarakSiku=F.X(lm[13])-F.X(lm[14]);
    const yTangan=(F.Y(lw)+F.Y(rw))/2;
    if(yTangan>1.2) return S("bawah","Tangan di bawah – angkat ke paras dada");
    if(jarakTangan>2.2 || jarakSiku>2.0) return S("buka","Dada dibuka, tangan ke belakang");
    if(jarakTangan<1.4 && yTangan>-0.6) return S("peluk","Tangan ke depan (peluk pokok)");
    return S("separa","Gerakan belum cukup jelas");
  }
},
/* 5 ------------------------------------------------------ */
{
  nama:"5. Regangan Sisi Badan Dinamik",
  fokus:"Otot rusuk dan sisi badan (obliques)",
  sedia:"Berdiri tegak, cantumkan kedua-dua tapak tangan di atas kepala.",
  perlu:[11,12,15,16,23,24],
  betul:["kanan","kiri"],
  kesan(F){
    const lw=F.lm[15], rw=F.lm[16];
    if(!(F.Y(lw)<-0.6 && F.Y(rw)<-0.6)) return S("bawah","Tangan tidak di atas kepala");
    if(F.D(lw,rw)>1.2) return S("renggang","Rapatkan kedua-dua tapak tangan");
    const condong=F.X(tengah(lw,rw), F.mh);
    if(condong<-0.7) return S("kanan","Badan condong ke kanan");
    if(condong> 0.7) return S("kiri","Badan condong ke kiri");
    return S("tegak","Badan tegak – condong lebih jauh");
  }
},
/* 6 ------------------------------------------------------ */
{
  nama:"6. Regangan Kuadrisep Dinamik",
  fokus:"Otot paha hadapan (quadriceps)",
  sedia:"Berdiri tegak, seluruh badan kelihatan.",
  perlu:[11,12,23,24,25,26],
  betul:["kanan","kiri"],
  kesan(F){
    const lm=F.lm, la=lm[27], ra=lm[28];
    const angkat=(la.y-ra.y)/F.sw;  // + = kaki kanan lebih tinggi
    if(angkat> 0.7) return F.D(lm[16],ra)<0.9 ? S("kanan","Kaki kanan diangkat & dipegang")
                                               : S("kanan_x","Kaki kanan diangkat, tapi tangan kanan tidak pegang");
    if(angkat<-0.7) return F.D(lm[15],la)<0.9 ? S("kiri","Kaki kiri diangkat & dipegang")
                                               : S("kiri_x","Kaki kiri diangkat, tapi tangan kiri tidak pegang");
    return S("bawah","Kedua-dua kaki di lantai");
  }
},
/* 7 ------------------------------------------------------ */
{
  nama:"7. Regangan Hamstring Dinamik",
  fokus:"Otot paha belakang (hamstrings)",
  sedia:"Menghadap kamera, seluruh badan kelihatan.",
  perlu:[11,12,23,24,25,26,27,28],
  betul:["bongkok_kanan","bongkok_kiri","bongkok"],
  kesan(F,B){
    const lm=F.lm, tgn=tengah(lm[15],lm[16]), lututY=(lm[25].y+lm[26].y)/2;
    const nisbah=((F.mh.y-F.ms.y)/F.sw)/B.torso;   // 1 = tegak, kecil = bongkok
    if(nisbah>0.8 && tgn.y<lututY) return S("tegak","Badan tegak");
    if(nisbah<0.65){
      if(tgn.y<lututY) return S("bongkok_x","Bongkok, tapi tangan belum capai bawah lutut");
      const dR=jarak(tgn,lm[28]), dL=jarak(tgn,lm[27]);
      if(Math.abs(dR-dL)/F.sw<0.15) return S("bongkok","Bongkok mencapai kaki");
      return dR<dL ? S("bongkok_kanan","Bongkok capai kaki kanan") : S("bongkok_kiri","Bongkok capai kaki kiri");
    }
    return S("separa","Separuh bongkok – teruskan");
  }
},
/* 8 ------------------------------------------------------ */
{
  nama:"8. Regangan Betis Dinamik",
  fokus:"Otot betis (gastrocnemius & soleus)",
  sedia:"Menghadap kamera, seluruh badan kelihatan.",
  perlu:[11,12,23,24,27,28],
  betul:["enjut_kanan","enjut_kiri","enjut"],
  kesan(F,B){
    const lm=F.lm;
    const turunBahu=(F.ms.y-B.bahuY)/B.sw;
    const nisbah=((F.mh.y-F.ms.y)/F.sw)/B.torso;
    if(!(turunBahu>0.12 || nisbah<0.9)) return S("tegak","Badan belum dienjut ke hadapan");
    const belakang=(lm[27].y-lm[28].y)/F.sw;     // + = kaki kanan lebih jauh ke belakang
    if(belakang> 0.08) return S("enjut_kanan","Enjut ke hadapan, kaki kanan di belakang");
    if(belakang<-0.08) return S("enjut_kiri","Enjut ke hadapan, kaki kiri di belakang");
    return S("enjut","Enjut ke hadapan");
  }
},
/* 9 ------------------------------------------------------ */
{
  nama:"9. Regangan Pangkal Paha Dinamik",
  fokus:"Otot pangkal paha (adductors)",
  sedia:"Kangkang luas, bengkok lutut (sumo), tangan di atas lutut.",
  perlu:[11,12,23,24,25,26,27,28],
  betul:["bawah","separuh"],
  kesan(F,B){
    const lm=F.lm;
    const luas=Math.abs(F.X(lm[27])-F.X(lm[28]))>1.5;
    const turun=(F.mh.y-B.pinggulY)/B.sw;
    if(turun>0.4) return luas ? S("bawah","Punggung ke bawah (posisi sumo)") : S("bawah_x","Kangkang kaki lebih luas");
    if(turun>0.15) return S("separuh","Punggung naik sedikit");
    return S("tegak","Berdiri tegak");
  }
},
/* 10 ----------------------------------------------------- */
{
  nama:"10. Putaran Buku Lali & Pergelangan Tangan",
  fokus:"Sendi pergelangan tangan dan buku lali",
  sedia:"Jalin jari-jemari kedua-dua tangan.",
  perlu:[11,12,15,16,27,28],
  betul:["kanan","kiri"],
  kesan(F,B,H){
    const lm=F.lm;
    const angkat=(lm[27].y-lm[28].y)/F.sw;  // + = kaki kanan diangkat
    const rapat=F.D(lm[15],lm[16])<0.7;
    const gerak=pergerakan(H,[15,16,31,32])/F.sw;
    const sisi = angkat>0.15 ? "kanan" : angkat<-0.15 ? "kiri" : null;
    if(!sisi) return S("bawah","Angkat sedikit sebelah kaki");
    if(!rapat) return S(sisi+"_x","Jalin jari kedua-dua tangan");
    return gerak>0.25 ? S(sisi,`Kaki ${sisi} diangkat & sedang memusing`)
                      : S(sisi+"_diam",`Kaki ${sisi} diangkat – pusingkan buku lali & tangan`);
  }
}
];


/* =========================================================
   ANTARA MUKA
   ========================================================= */
const $=id=>document.getElementById(id);
const video=$("video"), kanvas=$("kanvas"), ctx=kanvas.getContext("2d");
const lukis=new DrawingUtils(ctx);
let landmarker=null, strim=null, kamera="user", H=[], B=null, audio=null, vtAkhir=-1;
let mod="tutup";            // tutup | kalibrasi | aktif
let kalib={mula:0,data:[]};
let calon=null, calonMula=0, papar=null;   // untuk elak keputusan berkelip

// ---------- Ikon figura (SVG) untuk setiap regangan ----------

const KAD=["Leher","Bahu","Trisep","Dada & Belakang","Sisi Badan","Kuadrisep","Hamstring","Betis","Pangkal Paha","Buku Lali & Tangan"];
const WARNA=[["#6366f1","#8b5cf6"],["#0ea5e9","#06b6d4"],["#f97316","#f59e0b"],["#ec4899","#f43f5e"],["#10b981","#22c55e"],
             ["#8b5cf6","#d946ef"],["#14b8a6","#0ea5e9"],["#f59e0b","#eab308"],["#ef4444","#f97316"],["#3b82f6","#6366f1"]];
let pilihan=0;
const SVG_MULA='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>';
const SVG_HENTI='<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>';
$("senaraiEx").innerHTML=EX.map((e,i)=>`<button class="kad-ex${i===0?" dipilih":""}" data-i="${i}"
     style="--w1:${WARNA[i][0]};--w2:${WARNA[i][1]}">
   <span class="jubin">${IKON[i]}<span class="no">${i+1}</span></span><span class="nm">${KAD[i]}</span></button>`).join("");
$("senaraiEx").onclick=ev=>{
  const b=ev.target.closest(".kad-ex"); if(!b) return;
  pilihan=Number(b.dataset.i);
  document.querySelectorAll(".kad-ex").forEach(x=>x.classList.toggle("dipilih",x===b));
  b.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  kemasPanduan(); papar=null; calon=null;
};
function exSemasa(){ return EX[pilihan]; }
function kemasPanduan(){ const e=exSemasa(); $("ikonEx").innerHTML=IKON[pilihan]; $("ikonEx").style.background=`linear-gradient(135deg,${WARNA[pilihan][0]},${WARNA[pilihan][1]})`;
  $("tajukEx").textContent=e.nama.replace(/^\d+\.\s*/,""); $("fokus").textContent="Fokus: "+e.fokus; }
kemasPanduan();

function status(jenis,t){ const p=$("pil"); p.className="pil "+jenis; p.classList.remove("tersembunyi"); $("pilTeks").textContent=t; }
function kemasCermin(){ const c=$("cermin").checked; video.classList.toggle("cermin",c); kanvas.classList.toggle("cermin",c); }

function bunyi(betul){
  if(!audio || !$("bunyi").checked) return;
  const o=audio.createOscillator(), g=audio.createGain();
  o.frequency.value=betul?880:220; o.type=betul?"sine":"square";
  g.gain.setValueAtTime(0.12,audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+0.2);
  o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime+0.2);
}

function tunjuk(jenis, tajuk, sebab){
  const k=$("keputusan"); k.className="kad-hasil "+jenis;
  void k.offsetWidth; k.classList.add("pop");
  const ik = jenis==="hijau" ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff"/><path d="M6.5 12.5l3.5 3.5 7.5-8" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          : jenis==="merah" ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff"/><path d="M8 8l8 8M16 8l-8 8" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/></svg>' : "";
  $("kTajuk").innerHTML=ik+"<span></span>"; $("kTajuk").querySelector("span").textContent=tajuk; $("kSebab").textContent=sebab||"";
}

/* ---------- Kamera & model ---------- */
async function bukaKamera(){
  $("mesejTeks").textContent="Memuatkan kamera...";
  if(strim) strim.getTracks().forEach(t=>t.stop());
  try{
    strim=await navigator.mediaDevices.getUserMedia({video:{facingMode:kamera,width:{ideal:640},height:{ideal:480}},audio:false});
  }catch(e){ $("mesejTeks").textContent="Kamera tidak dapat dibuka: "+e.message+". Pastikan laman dibuka melalui https dan kebenaran kamera diberi."; return; }
  video.srcObject=strim; await video.play();
  $("cermin").checked=(kamera==="user"); kemasCermin();
  if(!landmarker){
    $("mesejTeks").textContent="Memuatkan model MediaPipe... (kali pertama mungkin lambat)";
    const fs=await FilesetResolver.forVisionTasks(WASM);
    const pilihan=d=>({baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:"VIDEO",numPoses:1});
    try{ landmarker=await PoseLandmarker.createFromOptions(fs,pilihan("GPU")); }
    catch{ landmarker=await PoseLandmarker.createFromOptions(fs,pilihan("CPU")); }
    requestAnimationFrame(gelung);
  }
  $("mesej").classList.add("tersembunyi");
  $("btnMula").disabled=false; $("btnTukar").disabled=false;
  $("btnKamera").classList.add("tersembunyi"); $("btnMula").classList.remove("tersembunyi"); status("sedia","Kamera sedia");
}
$("btnKamera").onclick=bukaKamera;
$("btnTukar").onclick=()=>{ kamera = kamera==="user" ? "environment" : "user"; bukaKamera(); };

$("btnMula").onclick=()=>{
  if(!audio){ try{ audio=new (window.AudioContext||window.webkitAudioContext)(); }catch{} }
  if(mod==="tutup"){ mod="kalibrasi"; kalib={mula:performance.now(),data:[]}; papar=null; calon=null;
    $("btnMula").innerHTML=SVG_HENTI+"Henti"; $("btnMula").classList.replace("utama","bahaya"); status("langsung","Sedang mengesan"); }
  else { mod="tutup"; $("keputusan").className="kad-hasil tersembunyi";
    $("btnMula").innerHTML=SVG_MULA+"Mula Kesan"; $("btnMula").classList.replace("bahaya","utama"); status("sedia","Kamera sedia"); }
};

/* ---------- Gelung utama (setiap bingkai video) ---------- */
function gelung(){
  requestAnimationFrame(gelung);
  if(!landmarker || video.readyState<2 || video.currentTime===vtAkhir) return;
  vtAkhir=video.currentTime;
  if(kanvas.width!==video.videoWidth){ kanvas.width=video.videoWidth; kanvas.height=video.videoHeight; }
  const kini=performance.now();
  const hasil=landmarker.detectForVideo(video,kini);
  const mentah=hasil.landmarks && hasil.landmarks[0];
  let F=null;
  if(mentah){
    const nisbah=video.videoWidth/video.videoHeight;          // betulkan nisbah lebar:tinggi
    const lm=mentah.map(p=>({x:p.x*nisbah,y:p.y,v:p.visibility ?? 1}));
    H.push({t:kini,lm}); while(H.length && kini-H[0].t>1000) H.shift();
    F=kerangka(lm);
  } else H=[];
  const warna=langkah(kini,F);
  ctx.clearRect(0,0,kanvas.width,kanvas.height);
  if(mentah){
    lukis.drawConnectors(mentah,PoseLandmarker.POSE_CONNECTIONS,{color:warna,lineWidth:4});
    lukis.drawLandmarks(mentah,{color:"#ffffff",fillColor:warna,radius:3,lineWidth:1});
  }
}

const nampak=(lm,idx)=>idx.every(i=>lm[i].v>NAMPAK_MIN);
const PERLU_KALIB=[0,7,8,11,12,23,24];

function langkah(kini,F){
  if(mod==="tutup") return "#ffffff";

  // 1) Kalibrasi: berdiri tegak 2 saat
  if(mod==="kalibrasi"){
    if(!F || !nampak(F.lm,PERLU_KALIB)){
      kalib={mula:kini,data:[]};
      tunjuk("kuning","Berdiri tegak","Hadap kamera – pastikan badan kelihatan"); return "#f59e0b";
    }
    kalib.data.push(ukurAsas(F));
    const baki=Math.max(1,Math.ceil((KALIB_MS-(kini-kalib.mula))/1000));
    tunjuk("biru","Kalibrasi… "+baki,"Berdiri tegak, jangan bergerak");
    if(kini-kalib.mula>=KALIB_MS){ B=puratakan(kalib.data); mod="aktif"; }
    return "#38bdf8";
  }

  // 2) Aktif: tentukan BETUL atau SALAH
  const ex=exSemasa();
  const r = !F ? S("tiada","Tiada murid dikesan")
          : !nampak(F.lm,ex.perlu) ? S("tak_nampak","Bahagian badan tidak kelihatan – undur sedikit")
          : ex.kesan(F,B,H);
  const betul=ex.betul.includes(r.s);
  const kunci=(betul?"B:":"S:")+r.s;

  // keputusan hanya bertukar bila keadaan baru stabil selama TAHAN_MS
  if(kunci!==calon){ calon=kunci; calonMula=kini; }
  if(kini-calonMula>=TAHAN_MS && (!papar || papar.kunci!==kunci)){
    const berubahJenis = !papar || papar.betul!==betul;
    papar={kunci,betul,t:r.t};
    tunjuk(betul?"hijau":"merah", betul?"BETUL":"SALAH", r.t);
    if(berubahJenis) bunyi(betul);
  }
  return betul ? "#22c55e" : "#ef4444";
}
